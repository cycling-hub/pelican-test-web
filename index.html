<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="鹈鹕测试 - 鹈鹕骑自行车动态 SVG 动画" />
    <title>鹈鹕测试 — Pelican on a Bicycle</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Microsoft YaHei', sans-serif;
        background: linear-gradient(160deg, #e0f2fe 0%, #fdf6ec 100%);
        color: #1a202c;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2rem 1rem;
      }

      header {
        text-align: center;
        margin-bottom: 1.5rem;
      }

      header h1 {
        font-size: 2rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin-bottom: 0.5rem;
      }

      header p {
        color: #64748b;
        font-size: 1rem;
      }

      .svg-container {
        background: #ffffff;
        border-radius: 24px;
        box-shadow: 0 12px 48px rgba(15, 23, 42, 0.10);
        padding: 1.2rem;
        max-width: 760px;
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }

      .svg-container svg {
        width: 100%;
        height: auto;
        max-height: 520px;
        display: block;
      }

      footer {
        margin-top: 1.8rem;
        text-align: center;
        color: #94a3b8;
        font-size: 0.85rem;
      }

      /* ===== CSS 动画（位移 / 透明度 / 虚线流动）===== */

      /* 鹈鹕身体上下颠簸 */
      .pelican {
        animation: bounce 0.6s ease-in-out infinite;
      }
      @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50%       { transform: translateY(-16px); }
      }

      /* 地面虚线向后流动 */
      .ground {
        animation: ground-flow 0.7s linear infinite;
      }
      @keyframes ground-flow {
        to { stroke-dashoffset: -18; }
      }

      /* 速度线向左飘动并淡出 */
      .speed-line {
        animation: speed-flow 0.9s linear infinite;
      }
      .speed-line:nth-of-type(2) { animation-delay: 0.3s; }
      .speed-line:nth-of-type(3) { animation-delay: 0.6s; }
      @keyframes speed-flow {
        0%   { transform: translateX(0);    opacity: 0.9; }
        100% { transform: translateX(-140px); opacity: 0; }
      }

      /* 云朵缓慢向右飘 */
      .cloud {
        animation: cloud-drift 22s linear infinite;
      }
      .cloud.fast {
        animation-duration: 16s;
      }
      @keyframes cloud-drift {
        0%   { transform: translateX(0); }
        100% { transform: translateX(90px); }
      }

      /* 音符上下漂浮 */
      .note {
        animation: note-float 1.6s ease-in-out infinite;
      }
      .note.delay {
        animation-delay: 0.8s;
      }
      @keyframes note-float {
        0%, 100% { transform: translateY(0);    opacity: 0.55; }
        50%       { transform: translateY(-18px); opacity: 1; }
      }

      /* 太阳光晕呼吸 */
      .sun-glow {
        animation: sun-pulse 3s ease-in-out infinite;
      }
      @keyframes sun-pulse {
        0%, 100% { opacity: 0.5; }
        50%       { opacity: 0.9; }
      }

      @media (max-width: 600px) {
        header h1 { font-size: 1.5rem; }
        .svg-container { padding: 0.6rem; border-radius: 16px; }
      }
    </style>
  </head>
  <body>

    <header>
      <h1>🚲 鹈鹕测试 · 动态版</h1>
      <p>让语言模型生成「鹈鹕骑自行车」的 SVG，并加上骑行动画</p>
    </header>

    <div class="svg-container">
      <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">

        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#bfe3fa" />
            <stop offset="100%" stop-color="#eef7fd" />
          </linearGradient>
        </defs>

        <!-- 天空背景 + 太阳 -->
        <rect x="0" y="0" width="800" height="500" fill="url(#sky)" />
        <circle class="sun-glow" cx="720" cy="80" r="52" fill="#ffd166" opacity="0.6" />
        <circle cx="720" cy="80" r="30" fill="#ffe08a" />

        <!-- 云朵 -->
        <g class="cloud fast">
          <ellipse cx="140" cy="90" rx="46" ry="18" fill="#ffffff" opacity="0.9" />
          <ellipse cx="175" cy="82" rx="32" ry="16" fill="#ffffff" opacity="0.9" />
          <ellipse cx="110" cy="84" rx="28" ry="14" fill="#ffffff" opacity="0.85" />
        </g>
        <g class="cloud">
          <ellipse cx="500" cy="64" rx="50" ry="19" fill="#ffffff" opacity="0.85" />
          <ellipse cx="538" cy="55" rx="34" ry="16" fill="#ffffff" opacity="0.85" />
          <ellipse cx="468" cy="57" rx="30" ry="14" fill="#ffffff" opacity="0.8" />
        </g>

        <!-- 地面 -->
        <line class="ground" x1="20" y1="430" x2="780" y2="430" stroke="#b6c4d4" stroke-width="4" stroke-dasharray="12,6" stroke-linecap="round" />


        <!-- ===== 自行车：车架（静止）===== -->
        <line x1="240" y1="380" x2="370" y2="320" stroke="#e53e3e" stroke-width="6" stroke-linecap="round"/>
        <line x1="310" y1="380" x2="340" y2="300" stroke="#e53e3e" stroke-width="6" stroke-linecap="round"/>
        <line x1="340" y1="300" x2="460" y2="300" stroke="#e53e3e" stroke-width="6" stroke-linecap="round"/>
        <line x1="460" y1="300" x2="520" y2="350" stroke="#e53e3e" stroke-width="6" stroke-linecap="round"/>
        <line x1="520" y1="350" x2="540" y2="380" stroke="#e53e3e" stroke-width="5" stroke-linecap="round"/>

        <!-- 座垫 -->
        <ellipse cx="330" cy="292" rx="28" ry="8" fill="#2d3748"/>
        <!-- 车把 -->
        <line x1="490" y1="290" x2="535" y2="282" stroke="#4a5568" stroke-width="5" stroke-linecap="round"/>
        <circle cx="490" cy="290" r="5" fill="#4a5568"/>
        <circle cx="535" cy="282" r="5" fill="#4a5568"/>

        <!-- ===== 后轮（外圈静止 + 辐条旋转）===== -->
        <circle cx="240" cy="380" r="55" fill="none" stroke="#4a5568" stroke-width="5"/>
        <g>
          <animateTransform attributeName="transform" attributeType="XML"
            type="rotate" from="0 240 380" to="360 240 380"
            dur="1.2s" repeatCount="indefinite"/>
          <line x1="240" y1="325" x2="240" y2="435" stroke="#718096" stroke-width="2"/>
          <line x1="185" y1="380" x2="295" y2="380" stroke="#718096" stroke-width="2"/>
          <line x1="201" y1="341" x2="279" y2="419" stroke="#718096" stroke-width="1.5"/>
          <line x1="279" y1="341" x2="201" y2="419" stroke="#718096" stroke-width="1.5"/>
        </g>
        <circle cx="240" cy="380" r="8" fill="#4a5568"/>

        <!-- ===== 前轮（外圈静止 + 辐条旋转）===== -->
        <circle cx="540" cy="380" r="55" fill="none" stroke="#4a5568" stroke-width="5"/>
        <g>
          <animateTransform attributeName="transform" attributeType="XML"
            type="rotate" from="0 540 380" to="360 540 380"
            dur="1.2s" repeatCount="indefinite"/>
          <line x1="540" y1="325" x2="540" y2="435" stroke="#718096" stroke-width="2"/>
          <line x1="485" y1="380" x2="595" y2="380" stroke="#718096" stroke-width="2"/>
          <line x1="501" y1="341" x2="579" y2="419" stroke="#718096" stroke-width="1.5"/>
          <line x1="579" y1="341" x2="501" y2="419" stroke="#718096" stroke-width="1.5"/>
        </g>
        <circle cx="540" cy="380" r="8" fill="#4a5568"/>

        <!-- ===== 曲柄 + 鹈鹕腿（一起绕轴旋转 = 蹬车）===== -->
        <g>
          <animateTransform attributeName="transform" attributeType="XML"
            type="rotate" from="0 370 320" to="360 370 320"
            dur="1.2s" repeatCount="indefinite"/>
          <!-- 左腿（近侧） -->
          <line x1="370" y1="320" x2="352" y2="356" stroke="#f6ad55" stroke-width="6" stroke-linecap="round"/>
          <ellipse cx="348" cy="360" rx="15" ry="6" fill="#f6ad55"/>
          <!-- 右腿（远侧，颜色更深制造层次） -->
          <line x1="370" y1="320" x2="388" y2="286" stroke="#ed8936" stroke-width="6" stroke-linecap="round"/>
          <ellipse cx="392" cy="282" rx="15" ry="6" fill="#ed8936"/>
          <!-- 中轴 -->
          <circle cx="370" cy="320" r="7" fill="#4a5568"/>
        </g>

        <!-- ===== 鹈鹕身体（上下颠簸）===== -->
        <g class="pelican">
          <!-- 尾巴 -->
          <g>
            <animateTransform attributeName="transform" attributeType="XML"
              type="rotate" from="-5 320 250" to="5 320 250"
              dur="1.2s" repeatCount="indefinite" additive="sum"/>
            <path d="M 320 250 Q 288 238 284 262 Q 302 268 320 258 Z" fill="#e8dcc8"/>
          </g>

          <!-- 身体 -->
          <ellipse cx="370" cy="240" rx="55" ry="42" fill="#f7f1e3"/>

          <!-- 翅膀（轻微扇动） -->
          <g>
            <animateTransform attributeName="transform" attributeType="XML"
              type="rotate" from="-7 358 225" to="7 358 225"
              dur="0.6s" repeatCount="indefinite" additive="sum"/>
            <path d="M 350 222 Q 370 200 402 214 Q 392 246 360 248 Z" fill="#e8dcc8" stroke="#d4c5a9" stroke-width="1"/>
            <path d="M 360 216 Q 375 210 390 222" fill="none" stroke="#d4c5a9" stroke-width="1"/>
            <path d="M 357 225 Q 373 219 388 230" fill="none" stroke="#d4c5a9" stroke-width="1"/>
          </g>

          <!-- 脖子 -->
          <path d="M 396 216 Q 422 184 432 164 Q 437 140 432 128"
                stroke="#f7f1e3" stroke-width="22" fill="none" stroke-linecap="round"/>

          <!-- 头 -->
          <circle cx="436" cy="122" r="22" fill="#f7f1e3"/>

          <!-- 眼睛（眨动） -->
          <g>
            <circle cx="443" cy="116" r="5" fill="#2d3748"/>
            <circle cx="445" cy="114" r="2" fill="#ffffff"/>
          </g>

          <!-- 喙 - 上喙 -->
          <path d="M 453 124 L 512 120 L 510 127 L 456 130 Z" fill="#f6ad55"/>
          <!-- 喙 - 下喙 / 喉囊 -->
          <path d="M 456 130 Q 476 158 508 126" fill="#ed8936" opacity="0.75"/>
          <!-- 喙尖钩 -->
          <path d="M 510 120 Q 516 122 512 128" fill="#dd6b20"/>
        </g>


        <!-- ===== 速度线 ===== -->
        <line class="speed-line" x1="150" y1="340" x2="210" y2="340" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity="0"/>
        <line class="speed-line" x1="130" y1="360" x2="200" y2="360" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity="0"/>
        <line class="speed-line" x1="140" y1="392" x2="205" y2="392" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity="0"/>

        <!-- 音符 -->
        <text class="note" x="620" y="150" font-size="28" fill="#ed8936">♪</text>
        <text class="note delay" x="668" y="126" font-size="22" fill="#f6ad55">♫</text>

      </svg>
    </div>

    <footer>
      <p>鹈鹕测试 · Pelican Test · 动态骑行 SVG 动画</p>
    </footer>

  </body>
</html>
